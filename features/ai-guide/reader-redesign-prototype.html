  :root {

    --primary-weak: #eef2ff;
    --primary-strong: #4338ca;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --border: #e5e7eb;
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --sidebar-w: 264px;
    --toc-w: 220px;
    --topbar-h: 56px;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
    --shadow-md: 0 6px 24px rgba(16, 24, 40, .10);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg-soft);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { color: var(--primary-strong); }
  button { font-family: inherit; cursor: pointer; }

  /* ===== 顶部导航 ===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    z-index: 50;
  }
  .menu-btn {
    display: none;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--radius);
    width: 34px; height: 34px;
    font-size: 15px;
    color: var(--text);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
  }
  .brand:hover { color: var(--text); }
  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;

  .search {
    flex: 1;
    max-width: 460px;
    margin-left: auto;
    position: relative;
  }
  .search input {
    width: 100%;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 12px 0 34px;
    font-size: 13px;
    background: var(--bg-soft);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus {
    border-color: var(--primary);
    background: var(--bg);
    box-shadow: 0 0 0 3px var(--primary-weak);
  }
  .search .ico {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    font-size: 14px;
  }
  .search kbd {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    background: var(--bg);
  }
  .top-actions { display: flex; gap: 8px; }
  .btn {
    height: 34px;
    padding: 0 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    white-space: nowrap;

  .btn:hover { background: var(--bg-soft); }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .progress {
    position: fixed;
    top: var(--topbar-h);
    left: 0; right: 0;
    height: 2px;
    z-index: 51;
    pointer-events: none;
  }
  .progress i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
  }

  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);

    max-width: 1500px;
    margin: 0 auto;
    padding-top: var(--topbar-h);
  }

  .sidebar {
    position: sticky;
    top: var(--topbar-h);
    height: calc(100vh - var(--topbar-h));
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--bg);
    padding: 14px 10px 40px;
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px 10px;
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: .03em;

  .tree { list-style: none; margin: 0; padding: 0; }

  .group { margin-bottom: 4px; }
  .group-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 8px;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    border-radius: 6px;
    text-align: left;
  }
  .group-toggle:hover { background: var(--bg-soft); }
  .group-toggle .arrow {
    font-size: 11px;
    color: var(--text-3);
    transition: transform .18s;
  }
  .group.collapsed .group-toggle .arrow { transform: rotate(-90deg); }
  .group.collapsed .group-body { display: none; }

  .category { margin: 2px 0 6px; }
  .category-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 8px 5px 18px;
    border: none;
    background: none;
    font-size: 12.5px;
    color: var(--text-2);
    border-radius: 6px;
    text-align: left;
  }
  .category-toggle:hover { background: var(--bg-soft); color: var(--text); }
  .category-toggle .arrow {
    font-size: 10px;
    color: var(--text-3);
    transition: transform .18s;
  }
  .category.collapsed .category-toggle .arrow { transform: rotate(-90deg); }
  .category.collapsed .doc-list { display: none; }

  .doc-list { list-style: none; margin: 0; padding: 0 0 0 10px; }
  .doc-item a {
    display: block;
    padding: 6px 10px 6px 20px;
    font-size: 12.5px;
    color: var(--text-2);
    border-radius: 6px;
    border-left: 2px solid transparent;
    line-height: 1.45;
  }
  .doc-item a:hover { background: var(--bg-soft); color: var(--text); }
  .doc-item a.active {
    background: var(--primary-weak);
    color: var(--primary-strong);
    font-weight: 600;
    border-left-color: var(--primary);
  }
  .sidebar-empty {
    padding: 20px 12px;
    font-size: 13px;
    color: var(--text-3);
    text-align: center;
  }

  /* ===== 内容区 ===== */
  .content {
    min-width: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
    min-height: calc(100vh - var(--topbar-h));
  }
  .doc { max-width: 760px; margin: 0 auto; padding: 40px 48px 80px; }

  .crumbs {
    font-size: 12.5px;
    color: var(--text-3);
    margin-bottom: 14px;
  }
  .crumbs span { color: var(--text-2); }
  .doc-title {
    font-size: 30px;
    line-height: 1.3;
    margin: 0 0 10px;
    letter-spacing: -.01em;
  }
  .doc-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12.5px;
    color: var(--text-3);
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .doc-meta .tag {
    background: var(--primary-weak);
    color: var(--primary-strong);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11.5px;
  }

  /* 问题小节卡片 */
  .qa {
    padding: 30px 0 34px;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: calc(var(--topbar-h) + 24px);
  }
  .qa:last-of-type { border-bottom: none; }
  .qa-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .qa-num {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    flex: none;
    padding-top: 3px;

  .qa-title { font-size: 20px; font-weight: 650; margin: 0; line-height: 1.4; }
  .qa-label {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .03em;
    color: var(--text-3);
    margin: 18px 0 8px;
    text-transform: uppercase;
  }
  .qa p { margin: 0 0 12px; color: #374151; font-size: 15px; }
  .qa ul { margin: 0 0 14px; padding-left: 20px; }
  .qa li { margin: 5px 0; color: #374151; font-size: 14.5px; }
  .qa .placeholder {
    background: var(--bg-soft);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text-3);
    font-size: 13px;
  }
  .qa code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }

  /* 上一篇 / 下一篇 */
  .pager {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 40px;
  }
  .pager a {
    display: block;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);

  .pager a:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
  .pager .dir { font-size: 11.5px; color: var(--text-3); display: block; margin-bottom: 4px; }
  .pager .ttl { font-size: 13.5px; font-weight: 600; }
  .pager a.next { text-align: right; }
  .pager a.empty { visibility: hidden; }

  /* ===== 右侧 TOC ===== */
  .toc {
    position: sticky;
    top: var(--topbar-h);
    height: calc(100vh - var(--topbar-h));
    overflow-y: auto;
    padding: 22px 16px 40px;
    background: transparent;
  }
  .toc-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .03em;
    color: var(--text-3);
    margin: 0 0 12px;
  }
  .toc-list { list-style: none; margin: 0; padding: 0; }
  .toc-list a {
    display: block;
    padding: 5px 0 5px 12px;
    border-left: 2px solid var(--border);
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.4;
  }
  .toc-list a:hover { color: var(--text); }
  .toc-list a.active {
    color: var(--primary-strong);
    border-left-color: var(--primary);
    font-weight: 600;
  }

  /* ===== 移动端 ===== */
  @media (max-width: 1080px) {
    .layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
    .toc { display: none; }
  }
  @media (max-width: 820px) {
    .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar {
      position: fixed;
      left: 0; top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      width: min(82vw, 320px);
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: var(--shadow-md);
      z-index: 40;
    }
    .sidebar.open { transform: translateX(0); }
    .doc { padding: 28px 20px 64px; }
    .search { display: none; }
  }
  .backdrop {
    display: none;
    position: fixed; inset: var(--topbar-h) 0 0 0;
    background: rgba(15, 23, 42, .32);
    z-index: 35;
  }
  .backdrop.show { display: block; }
</style>
</head>

/* ============ 渲染 ============ */
const treeEl = document.getElementById('tree');
const docEl = document.getElementById('doc');
const tocEl = document.getElementById('tocList');
const docCountEl = document.getElementById('docCount');
const sidebarEl = document.getElementById('sidebar');
const backdropEl = document.getElementById('backdrop');
const menuBtn = document.getElementById('menuBtn');
const searchInput = document.getElementById('searchInput');
const progressBar = document.getElementById('progressBar');

let activeDocId = 'agent-core';
let collapsedGroups = new Set();
let collapsedCategories = new Set();

function renderTree() {
  treeEl.innerHTML = '';
  const q = searchInput.value.trim().toLowerCase();

  TREE.forEach((group) => {
    const li = document.createElement('li');
    li.className = 'group' + (collapsedGroups.has(group.code) ? ' collapsed' : '');

    const toggle = document.createElement('button');
    toggle.className = 'group-toggle';
    toggle.innerHTML = `<span>${group.name}</span><span class="arrow">▼</span>`;
    toggle.onclick = () => {
      if (collapsedGroups.has(group.code)) collapsedGroups.delete(group.code);
      else collapsedGroups.add(group.code);
      renderTree();
    };

    const body = document.createElement('div');
    body.className = 'group-body';

    group.categories.forEach((cat) => {
      const catLi = document.createElement('div');
      catLi.className = 'category' + (collapsedCategories.has(cat.code) ? ' collapsed' : '');

      const catToggle = document.createElement('button');
      catToggle.className = 'category-toggle';
      catToggle.innerHTML = `<span>${cat.name}</span><span class="arrow">▼</span>`;
      catToggle.onclick = () => {
        if (collapsedCategories.has(cat.code)) collapsedCategories.delete(cat.code);
        else collapsedCategories.add(cat.code);
        renderTree();
      };

      const list = document.createElement('ul');
      list.className = 'doc-list';

      cat.docs.forEach((doc) => {
        const d = DOCS[doc.id];
        const hay = (doc.title + ' ' + group.name + ' ' + cat.name).toLowerCase();
        if (q && !hay.includes(q)) return;

        const item = document.createElement('li');
        item.className = 'doc-item';
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = doc.title;
        if (doc.id === activeDocId) a.className = 'active';
        a.onclick = (e) => { e.preventDefault(); setActiveDoc(doc.id); closeSidebar(); };
        item.appendChild(a);
        list.appendChild(item);
      });

      if (list.children.length === 0) return;

      catLi.appendChild(catToggle);
      catLi.appendChild(list);
      body.appendChild(catLi);
    });

    li.appendChild(toggle);
    li.appendChild(body);
    treeEl.appendChild(li);
  });
}

function setActiveDoc(id) {
  activeDocId = id;
  renderTree();
  renderDoc(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderDoc(id) {
  const d = DOCS[id];
  docCountEl.textContent = '';

  const crumbs = document.createElement('div');
  crumbs.className = 'crumbs';
  crumbs.innerHTML = `<span>${d.crumb}</span>`;

  const title = document.createElement('h1');
  title.className = 'doc-title';
  title.textContent = d.title;

  const meta = document.createElement('div');
  meta.className = 'doc-meta';
  meta.innerHTML = `<span class="tag">${d.tag}</span><span>${d.meta}</span>`;

  docEl.innerHTML = '';
  docEl.appendChild(crumbs);
  docEl.appendChild(title);
  docEl.appendChild(meta);

  d.sections.forEach((s) => {
    const sec = document.createElement('section');
    sec.className = 'qa';
    sec.id = 'sec-' + s.num;

    const head = document.createElement('div');
    head.className = 'qa-head';
    head.innerHTML = `<span class="qa-num">${s.num}</span><h2 class="qa-title">${s.title}</h2>`;

    const body = document.createElement('div');
    body.innerHTML = s.body;

    sec.appendChild(head);
    sec.appendChild(body);
    docEl.appendChild(sec);
  });

  const pager = document.createElement('nav');
  pager.className = 'pager';

  const prev = document.createElement('a');
  prev.href = '#';
  if (d.prev) {
    prev.innerHTML = `<span class="dir">上一篇</span><span class="ttl">${DOCS[d.prev].title}</span>`;
    prev.onclick = (e) => { e.preventDefault(); setActiveDoc(d.prev); };
  } else {
    prev.className = 'empty';
  }

  const next = document.createElement('a');
  next.href = '#';
  next.className = 'next';
  if (d.next) {
    next.innerHTML = `<span class="dir">下一篇</span><span class="ttl">${DOCS[d.next].title}</span>`;
    next.onclick = (e) => { e.preventDefault(); setActiveDoc(d.next); };
  } else {
    next.className = 'empty';
  }

  pager.appendChild(prev);
  pager.appendChild(next);
  docEl.appendChild(pager);

  renderToc(d);
}

function renderToc(d) {
  tocEl.innerHTML = '';
  d.sections.forEach((s) => {
    const a = document.createElement('a');
    a.href = '#sec-' + s.num;
    a.textContent = s.title;
    a.onclick = (e) => {
      e.preventDefault();
      document.getElementById('sec-' + s.num).scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    tocEl.appendChild(a);
  });
}

/* ============ 交互：搜索、滚动高亮、进度、移动端 ============ */
searchInput.addEventListener('input', () => {
  TREE.forEach((g) => collapsedGroups.delete(g.code));
  TREE.forEach((g) => g.categories.forEach((c) => collapsedCategories.delete(c.code)));
  renderTree();
});

let activeSection = '';
const sectionObserver = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting) {
      activeSection = e.target.id;
      highlightToc();
      highlightProgress();
    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });

function observeSections() {
  document.querySelectorAll('.qa').forEach((s) => sectionObserver.observe(s));
}

function highlightToc() {
  tocEl.querySelectorAll('a').forEach((a) => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + activeSection);
  });
}

function highlightProgress() {
  const secs = Array.from(document.querySelectorAll('.qa'));
  if (!secs.length) return;
  const idx = secs.findIndex((s) => s.id === activeSection);
  const pct = (idx + 1) / secs.length * 100;
  progressBar.style.width = pct + '%';
}

window.addEventListener('scroll', () => {
  const doc = document.documentElement;
  const max = doc.scrollHeight - doc.clientHeight;
  const pct = max > 0 ? (doc.scrollTop / max) * 100 : 0;
  // 进度条由“章节位置”驱动（highlightProgress），此处保留滚动兜底
}, { passive: true });

function closeSidebar() {
  sidebarEl.classList.remove('open');
  backdropEl.classList.remove('show');
}
menuBtn.addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  backdropEl.classList.toggle('show');
});
backdropEl.addEventListener('click', closeSidebar);

/* 快捷键 ⌘K 聚焦搜索 */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
});

/* ============ 初始化 ============ */
renderTree();
renderDoc(activeDocId);
observeSections();
</script>
