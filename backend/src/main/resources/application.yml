server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: daily-quote-backend
  datasource:
    # 数据库连接信息仅从环境变量读取；仓库内不落任何数据库口令
    url: ${DB_URL:jdbc:postgresql://localhost:5432/daily_quote}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

mybatis:
  # 显式指定 Mapper XML 位置：缺省时部分版本不自动扫描，会触发
  # 「Invalid bound statement」运行时错误（单测 mock 了 Mapper，无法暴露此问题）
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
