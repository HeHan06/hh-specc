# ============================================================
# specc 平台配置（M9 配置管理）
# 安全约定：
#   - 本文件只放非敏感配置，可入库
#   - API 密钥一律走环境变量（如 DASHSCOPE_API_KEY），禁止写入本文件
# ============================================================

# ---- 应用元信息 ----
app:
  # 框架名称
  name: hh-specc
  # 框架发布版本（★ 单一真相源：与 git tag 保持一致，specc.sh --version 读取此处）
  version: 0.0.0

# ---- 引擎配置 ----
engine:
  # 引擎类型：codex（调用 Codex Harness）| manual（产物模式：输出提示词由人工在任意 IDE 执行）
  type: codex
  # 提示词组装结果的输出目录（manual 模式与调试用）
  output_dir: .specc-cache/prompts

# ---- 模型配置（可切换，不硬编码）----
# 切换模型只需修改本段，lib/engines.sh 会自动据此生成 Codex 配置。
model:
  # 默认模型 ID：绝大多数阶段（文本/推理）使用
  id: deepseek-v4-pro
  # provider 标识：对应 Codex config.toml 的 model_provider（可自定义）
  provider: deepseek
  # provider 显示名（仅用于 Codex 配置展示）
  provider_name: DeepSeek
  # OpenAI 兼容端点（DeepSeek 官方端点，原生支持 Responses API）
  base_url: https://api.deepseek.com
  # 协议：responses（Codex v0.144+ 默认；DeepSeek V4 正式版原生支持）
  wire_api: responses
  # 密钥所在的环境变量名（密钥本身不入库）
  api_key_env: DEEPSEEK_API_KEY
  # 多模态（视觉）模型：仅在「需要看图片」的环节使用，其余字段继承顶层 model
  vision:
    id: deepseek-v4-flash-vision-exp

# ---- 流程配置 ----
pipeline:
  # 流程裁剪：full（六阶段全走）；light / change 为 v0.2 规划
  profile: full
  # 上下文组装的体积告警阈值（字符数），超过则提示裁剪
  context_warn_chars: 60000

# ---- 任务执行配置（implement 阶段）----
tasks:
  # 单任务自动重试次数（超过则挂起转人工，见 implement 阶段指令）
  max_retry: 1

# ---- 知识库（corpus）配置：辅助上下文，只「选读 + 引用」不复制 ----
knowledge:
  # 是否启用知识库机制（false 时 specify 阶段忽略 knowledge/ 目录）
  enabled: true
  # 选读决策模式：
  #   manual = 模型先出候选清单(knowledge/selection.md)，你编辑确认后再重跑读取（推荐）
  #   auto   = 按 selection.md 直接选读，不经人工编辑
  selection: manual
  # 单次最多选读文件数（防上下文超限）
  max_files: 8
