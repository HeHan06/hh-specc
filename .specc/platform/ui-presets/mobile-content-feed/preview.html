<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UI 预设视觉图 · mobile-content-feed（移动端内容流范式）</title>
<!--
  本文件是「mobile-content-feed」预设的视觉预览图（资产），用于 `./specc.sh ui <ID> list` 时
  展示给用户确认选型，不参与引擎注入。
  设计令牌 / 布局骨架 / 组件纪律的唯一权威源见同目录 README.md（FRAMEWORK-DEV §1.2）。
  本预览为可视呈现，若与 README 有出入，以 README 为准。
-->
<style>
  :root {
    --color-bg: #f7f8fa;
    --color-surface: #ffffff;
    --color-primary: #07c160;
    --color-text: #1f2937;
    --color-text-secondary: #9ca3af;
    --color-divider: #e5e7eb;
    --radius-card: 12px;
    --radius-btn: 8px;
    --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e9ecef;
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; align-items: center;
    padding: 24px;
  }
  /* 手机外壳 */
  .phone {
    width: 390px; max-width: 100%;
    background: var(--color-bg);
    border-radius: 32px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.22);
    overflow: hidden;
    border: 8px solid #111;
  }
  /* 顶部状态栏 + 导航 */
  .navbar { background: var(--color-bg); padding: 14px 16px 8px; position: sticky; top: 0; }
  .navbar .nav { display: flex; align-items: center; justify-content: space-between; }
  .navbar .back { font-size: 18px; color: var(--color-text); }
  .navbar .title { font-size: 17px; font-weight: 600; }
  .navbar .action { font-size: 15px; color: var(--color-primary); }
  .tabs { display: flex; gap: 20px; margin-top: 12px; font-size: 16px; color: var(--color-text-secondary); }
  .tabs .on { color: var(--color-text); font-weight: 600; border-bottom: 3px solid var(--color-primary); padding-bottom: 6px; }
  /* 卡片流 */
  .feed { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; }
  .cover { height: 150px; background: linear-gradient(135deg, #07c160, #34d399); position: relative; }
  .cover.c2 { background: linear-gradient(135deg, #2563eb, #60a5fa); }
  .cover.c3 { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
  .cover .tag { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,0.45); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .card .body { padding: 12px 14px 14px; }
  .card .title { font-size: 20px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .desc { font-size: 16px; color: #6b7280; line-height: 1.5; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--color-text-secondary); }
  .card .meta .src { color: var(--color-primary); }
  .card .meta .like { margin-left: auto; }
  /* 加载尾部 */
  .end { text-align: center; color: var(--color-text-secondary); font-size: 14px; padding: 8px 0 20px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="navbar">
      <div class="nav">
        <span class="back">‹</span>
        <span class="title">今日推荐</span>
        <span class="action">搜索</span>
      </div>
      <div class="tabs">
        <span class="on">推荐</span><span>关注</span><span>最新</span>
      </div>
    </div>
    <div class="feed">
      <div class="card">
        <div class="cover"><span class="tag">置顶</span></div>
        <div class="body">
          <div class="title">如何在一场面试中把项目经历讲得让面试官记住你</div>
          <div class="desc">项目经历是面试的核心战场。关键不是堆砌技术名词，而是用「背景—冲突—行动—结果」的结构，把一件你真正做过的事讲清楚…</div>
          <div class="meta"><span class="src">面经精选</span><span>·</span><span>2 小时前</span><span class="like">♥ 128</span></div>
        </div>
      </div>
      <div class="card">
        <div class="cover c2"></div>
        <div class="body">
          <div class="title">系统设计题：从零设计一个短链接服务</div>
          <div class="desc">高频考点。从流量估算、存储选型到缓存与限流，一步步拆解一个高可用短链系统的完整链路…</div>
          <div class="meta"><span class="src">技术图谱</span><span>·</span><span>昨天</span><span class="like">♥ 96</span></div>
        </div>
      </div>
      <div class="card">
        <div class="cover c3"></div>
        <div class="body">
          <div class="title">大厂面试官最看重的三个软素质</div>
          <div class="desc">除了技术硬实力，沟通、ownership 和复盘能力往往是决定你能否过终面的关键变量…</div>
          <div class="meta"><span class="src">面试内参</span><span>·</span><span>3 天前</span><span class="like">♥ 71</span></div>
        </div>
      </div>
      <div class="end">—— 上拉加载更多 ——</div>
    </div>
  </div>
</body>
</html>
